<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Drop Viewer</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:     #1a1a2e; --bg2: #16213e; --bg3: #0f3460;
  --accent: #e94560; --gold: #f5c518; --text: #e0e0e0;
  --dim:    #7a7a9a; --border: #2a2a4a;
  --green:  #4caf50; --blue: #64b5f6; --purple: #ba68c8;
  --orange: #ff9800;
}
body {
  background: var(--bg); color: var(--text);
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-size: 13px; height: 100vh;
  display: flex; flex-direction: column; overflow: hidden;
}
#titlebar, .section-hdr, .drop-row, #status, .npc-item { user-select: none; }

#titlebar {
  background: linear-gradient(135deg, var(--bg3), var(--bg2));
  border-bottom: 2px solid var(--accent);
  padding: 8px 12px; display: flex; align-items: center; gap: 8px; flex-shrink: 0;
}
#npc-img {
  width: 40px; height: 40px; object-fit: contain; image-rendering: pixelated;
  flex-shrink: 0; display: none; border-radius: 3px;
}
#titlebar .logo { font-size: 18px; }
#titlebar .titles { flex: 1; min-width: 0; }
#titlebar h1 { font-size: 13px; font-weight: 700; color: var(--gold); }
#titlebar .subtitle { font-size: 11px; color: var(--dim); margin-top: 1px; }
#close, #settings-btn {
  background: none; border: 1px solid var(--border); color: var(--dim);
  width: 22px; height: 22px; border-radius: 3px; cursor: pointer;
  font-size: 12px; display: flex; align-items: center; justify-content: center;
}
#close:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
#settings-btn:hover { background: var(--bg3); color: var(--gold); border-color: var(--gold); }
#settings-btn.active { background: var(--bg3); color: var(--gold); border-color: var(--gold); }

#settings-panel {
  display: none; position: fixed; top: 40px; right: 4px; z-index: 1000;
  background: var(--bg2); border: 1px solid var(--border); border-radius: 6px;
  padding: 10px 14px; min-width: 200px; box-shadow: 0 4px 16px #0008;
  font-size: 12px;
}
#settings-panel.open { display: block; }
#settings-panel h3 { font-size: 11px; color: var(--dim); margin-bottom: 8px;
  text-transform: uppercase; letter-spacing: 0.05em; }
.settings-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 4px 0; gap: 12px;
}
.settings-row label { color: var(--text); cursor: pointer; flex: 1; }
.toggle {
  width: 32px; height: 18px; background: var(--border); border-radius: 9px;
  position: relative; cursor: pointer; transition: background 0.2s; flex-shrink: 0;
}
.toggle.on { background: var(--green); }
.toggle::after {
  content: ''; position: absolute; width: 12px; height: 12px;
  background: #fff; border-radius: 50%; top: 3px; left: 3px; transition: left 0.2s;
}
.toggle.on::after { left: 17px; }

.settings-row--stack { flex-direction: column; align-items: stretch; gap: 4px; }
.settings-row--stack label { display: flex; justify-content: space-between; }
#opacity-value { color: var(--dim); font-size: 11px; }
#opacity-slider {
  -webkit-appearance: none; appearance: none; width: 100%; height: 4px;
  background: var(--border); border-radius: 2px; outline: none; cursor: pointer;
}
#opacity-slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 14px; height: 14px;
  background: var(--gold); border-radius: 50%; cursor: pointer; border: none;
}
#opacity-slider::-moz-range-thumb {
  width: 14px; height: 14px; background: var(--gold); border-radius: 50%;
  cursor: pointer; border: none;
}

#searchbar {
  background: var(--bg2); border-bottom: 1px solid var(--border);
  padding: 7px 10px; display: flex; gap: 5px; flex-shrink: 0;
}
#search-input {
  flex: 1; background: var(--bg); border: 1px solid var(--border);
  border-radius: 4px; color: var(--text); padding: 5px 8px;
  font-size: 12px; outline: none; cursor: text;
  user-select: text; -webkit-user-select: text;
}
#search-input:focus { border-color: var(--accent); }
#search-btn {
  background: var(--accent); border: none; border-radius: 4px;
  color: #fff; padding: 5px 12px; cursor: pointer; font-size: 12px; font-weight: 600;
}
#search-btn:hover { opacity: 0.85; }

#status {
  padding: 5px 12px; font-size: 11px; color: var(--dim);
  border-bottom: 1px solid var(--border); min-height: 24px; flex-shrink: 0;
}
#status.ok   { color: var(--green); }
#status.err  { color: var(--accent); }
#status.busy { color: var(--gold); }

#back-btn {
  display: none; background: var(--bg3); border: none; color: var(--dim);
  padding: 4px 10px; font-size: 11px; cursor: pointer;
  border-bottom: 1px solid var(--border); width: 100%; text-align: left; flex-shrink: 0;
}
#back-btn:hover { color: var(--text); }

#content { flex: 1; overflow-y: auto; position: relative; }
#content::-webkit-scrollbar { width: 4px; }
#content::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 2px; }

/* ── NPC Browser ── */
#npc-browser { display: flex; flex-direction: column; height: 100%; }
#npc-list-header {
  padding: 5px 12px; font-size: 10px; color: var(--dim);
  border-bottom: 1px solid var(--border); background: var(--bg2);
  display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
}
#npc-list { flex: 1; overflow-y: auto; }
#npc-list::-webkit-scrollbar { width: 4px; }
#npc-list::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 2px; }
.npc-item {
  padding: 7px 12px; border-bottom: 1px solid rgba(42,42,74,0.4);
  cursor: pointer; display: flex; align-items: center; gap: 8px; transition: background 0.1s;
}
.npc-item:hover { background: rgba(233,69,96,0.1); }
.npc-item .npc-icon { font-size: 14px; width: 20px; text-align: center; flex-shrink: 0; }
.npc-item .npc-name { font-size: 12px; color: var(--text); flex: 1; }
.npc-item .npc-cat  { font-size: 10px; color: var(--dim); }
#npc-empty  { padding: 20px; text-align: center; color: var(--dim); font-size: 11px; }
#list-status { padding: 6px 12px; font-size: 10px; color: var(--gold); text-align: center; }

/* ── Disambiguation ── */
#disambig {
  display: none; padding: 12px;
}
#disambig h3 { font-size: 12px; color: var(--gold); margin-bottom: 8px; }
#disambig p  { font-size: 11px; color: var(--dim); margin-bottom: 10px; }
.disambig-option {
  padding: 7px 10px; background: var(--bg2); border: 1px solid var(--border);
  border-radius: 4px; margin-bottom: 6px; cursor: pointer; font-size: 12px;
  transition: background 0.1s;
}
.disambig-option:hover { background: var(--bg3); border-color: var(--accent); }

/* ── Drops view ── */
#drops { display: none; }
.section-hdr {
  background: var(--bg3); padding: 5px 12px;
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
  color: var(--gold); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 1;
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; user-select: none;
  transition: background 0.15s;
}
.section-hdr:hover { background: #143d6e; }
.section-hdr .hdr-left { display: flex; align-items: center; gap: 6px; }
.section-hdr .chevron {
  font-size: 8px; transition: transform 0.2s; display: inline-block;
  color: var(--dim);
}
.section-hdr.collapsed .chevron { transform: rotate(-90deg); }
.section-hdr .row-count { font-size: 9px; color: var(--dim); font-weight: 400; }
.section-body { overflow: hidden; transition: max-height 0.25s ease; }
.section-body.collapsed { max-height: 0 !important; }
.drop-row {
  display: flex; align-items: center; padding: 4px 10px; gap: 8px;
  border-bottom: 1px solid rgba(42,42,74,0.4); transition: background 0.1s;
}
.drop-row:hover { background: rgba(255,255,255,0.035); }
.item-img {
  width: 28px; height: 28px; flex-shrink: 0;
  object-fit: contain; image-rendering: pixelated;
}
.item-placeholder {
  width: 28px; height: 28px; flex-shrink: 0; background: var(--bg3);
  border-radius: 3px; display: flex; align-items: center; justify-content: center;
  font-size: 13px; color: var(--dim);
}
.item-info { flex: 1; min-width: 0; }
.item-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
.item-qty  { font-size: 10px; color: var(--dim); margin-top: 1px; }
.rarity    { flex-shrink: 0; }
.badge { display: inline-block; padding: 1px 5px; border-radius: 3px; font-size: 10px; font-weight: 700; }
.b-always   { background: var(--green); color: #fff; }
.b-common   { border: 1px solid var(--green);  color: var(--green); }
.b-uncommon { border: 1px solid var(--blue);   color: var(--blue); }
.b-rare     { border: 1px solid var(--purple); color: var(--purple); }
.b-vr       { border: 1px solid var(--accent); color: var(--accent); }
.b-ultra    { border: 1px solid var(--orange); color: var(--orange); }
.b-unknown  { border: 1px solid var(--dim);    color: var(--dim); }
</style>
</head>
<body>

<div id="titlebar">
  <img id="npc-img" alt="NPC"/>
  <span class="logo" id="titlebar-logo">📜</span>
  <div class="titles">
    <h1>Drop Viewer</h1>
    <div class="subtitle" id="subtitle">Search any NPC</div>
  </div>
  <button id="settings-btn" title="Settings">⚙</button>
  <button id="close">✕</button>
</div>

<div id="settings-panel">
  <h3>Settings</h3>
  <div class="settings-row">
    <label for="toggle-debug">Show debug log</label>
    <div class="toggle" id="toggle-debug"></div>
  </div>
  <div class="settings-row">
    <label for="toggle-ocr-canvas">Show OCR preview</label>
    <div class="toggle" id="toggle-ocr-canvas"></div>
  </div>
  <div class="settings-row settings-row--stack">
    <label for="opacity-slider">Window opacity <span id="opacity-value">100%</span></label>
    <input type="range" id="opacity-slider" min="30" max="100" step="5" value="100"/>
  </div>
</div>

<div id="searchbar">
  <input id="search-input" type="text" placeholder="Search NPCs..." autocomplete="off"/>
  <button id="search-btn">Search</button>
</div>

<div id="status"></div>
<button id="back-btn">← Back</button>

<div id="content">
  <div id="npc-browser">
    <div id="npc-list-header">
      <span id="list-label">Loading monster list from wiki...</span>
      <span id="list-count"></span>
    </div>
    <div id="list-status"></div>
    <div id="npc-list"></div>
  </div>

  <div id="disambig">
    <h3>⚠️ Disambiguation</h3>
    <p id="disambig-msg"></p>
    <div id="disambig-options"></div>
  </div>

  <div id="drops"></div>
</div>

<script>
const WIKI = 'https://runescape.wiki/api.php';

// ── State ──────────────────────────────────────────────────
let allMonsters = [];   // full list loaded from SMW
let inDropsView = false;
let searchTimer = null;

// ── Settings ───────────────────────────────────────────────
const settings = { debugLog: false, ocrCanvas: false, opacity: 100 };

function saveSetting(key, val) {
  settings[key] = val;
  try { localStorage.setItem('dvSettings', JSON.stringify(settings)); } catch(e) {}
}
(function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem('dvSettings') || '{}');
    if (s.debugLog  !== undefined) settings.debugLog  = s.debugLog;
    if (s.ocrCanvas !== undefined) settings.ocrCanvas = s.ocrCanvas;
    if (typeof s.opacity === 'number') settings.opacity = Math.max(30, Math.min(100, s.opacity));
  } catch(e) {}
})();

const DEBUG_OVERLAY_HEIGHT = 180;

function applyToggleUI() {
  document.getElementById('toggle-debug').classList.toggle('on', settings.debugLog);
  document.getElementById('toggle-ocr-canvas').classList.toggle('on', settings.ocrCanvas);
  const slider = document.getElementById('opacity-slider');
  const valLabel = document.getElementById('opacity-value');
  if (slider) slider.value = settings.opacity;
  if (valLabel) valLabel.textContent = settings.opacity + '%';
  document.body.style.opacity = (settings.opacity / 100).toString();
  const dbgEl = getOrCreateDebugOverlay();
  const ocrEl = getOrCreateOcrCanvas();
  dbgEl.style.display = settings.debugLog  ? 'block' : 'none';
  ocrEl.style.display = settings.ocrCanvas ? 'block' : 'none';
  // OCR preview sits directly above the debug overlay when shown, else at window bottom
  ocrEl.style.bottom = settings.debugLog ? (DEBUG_OVERLAY_HEIGHT + 'px') : '0px';
}

function getOrCreateDebugOverlay() {
  let el = document.getElementById('section-debug');
  if (!el) {
    el = document.createElement('div');
    el.id = 'section-debug';
    el.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,0.88);color:#00ff00;' +
      'font-family:monospace;font-size:11px;line-height:1.5;padding:6px 8px;' +
      'height:' + DEBUG_OVERLAY_HEIGHT + 'px;overflow-y:auto;z-index:9999;white-space:pre-wrap;' +
      'box-sizing:border-box;';
    el.style.display = 'none';
    document.body.appendChild(el);
  }
  return el;
}

function getOrCreateOcrCanvas() {
  let el = document.getElementById('dbg-ocr-canvas');
  if (!el) {
    el = document.createElement('canvas');
    el.id = 'dbg-ocr-canvas';
    el.style.cssText = 'position:fixed;bottom:0;right:4px;border:2px solid #f5c518;' +
      'image-rendering:pixelated;z-index:9999;background:#222;max-width:98vw;min-width:40px;min-height:20px;';
    el.style.display = 'none';
    document.body.appendChild(el);
  }
  return el;
}

document.getElementById('settings-btn').addEventListener('click', function(e) {
  e.stopPropagation();
  const panel = document.getElementById('settings-panel');
  const btn   = document.getElementById('settings-btn');
  panel.classList.toggle('open');
  btn.classList.toggle('active', panel.classList.contains('open'));
  applyToggleUI();
});
document.addEventListener('click', function() {
  document.getElementById('settings-panel').classList.remove('open');
  document.getElementById('settings-btn').classList.remove('active');
});
document.getElementById('settings-panel').addEventListener('click', function(e) { e.stopPropagation(); });

document.getElementById('toggle-debug').addEventListener('click', function() {
  saveSetting('debugLog', !settings.debugLog);
  applyToggleUI();
});
document.getElementById('toggle-ocr-canvas').addEventListener('click', function() {
  saveSetting('ocrCanvas', !settings.ocrCanvas);
  applyToggleUI();
});
document.getElementById('opacity-slider').addEventListener('input', function(e) {
  saveSetting('opacity', parseInt(e.target.value, 10) || 100);
  applyToggleUI();
});

// ── Debug ──────────────────────────────────────────────────
// Always append to the overlay (capped to the last 200 lines) so that toggling
// "Show debug log" on at any time reveals the full history. The overlay's CSS
// display is controlled by applyToggleUI() — dbg() never changes visibility.
const DEBUG_MAX_LINES = 200;
function dbg(s) {
  console.log('[DropViewer]', s);
  const overlay = getOrCreateDebugOverlay();
  const escaped = String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  overlay.innerHTML += escaped + '<br>';
  const lines = overlay.innerHTML.split('<br>');
  if (lines.length > DEBUG_MAX_LINES) overlay.innerHTML = lines.slice(-DEBUG_MAX_LINES).join('<br>');
  overlay.scrollTop = overlay.scrollHeight;
}

// ── Status ─────────────────────────────────────────────────
function setStatus(type, msg) {
  const el = document.getElementById('status');
  el.className = type; el.textContent = msg;
}

// ── View switching ─────────────────────────────────────────
function showBrowser() {
  document.getElementById('npc-browser').style.display = 'flex';
  document.getElementById('disambig').style.display = 'none';
  document.getElementById('drops').style.display = 'none';
  document.getElementById('back-btn').style.display = 'none';
  document.getElementById('subtitle').textContent = 'Search any NPC';
  // Reset NPC image back to logo
  document.getElementById('npc-img').style.display = 'none';
  document.getElementById('titlebar-logo').style.display = 'inline';
  inDropsView = false;
}
function showDisambig() {
  document.getElementById('npc-browser').style.display = 'none';
  document.getElementById('disambig').style.display = 'block';
  document.getElementById('drops').style.display = 'none';
  document.getElementById('back-btn').style.display = 'block';
  inDropsView = false;
}
function showDrops() {
  document.getElementById('npc-browser').style.display = 'none';
  document.getElementById('disambig').style.display = 'none';
  document.getElementById('drops').style.display = 'block';
  document.getElementById('back-btn').style.display = 'block';
  inDropsView = true;
}

// ── Load full monster list from SMW ───────────────────────
// Uses the Semantic MediaWiki API to get all pages with a
// "Monster JSON" property (i.e. all monster pages on the wiki).
async function loadMonsterList() {
  document.getElementById('list-status').textContent = '⏳ Loading monster list...';
  let monsters = [];
  let offset = 0;
  const limit = 500;

  try {
    while (true) {
      const query = `[[Monster JSON::+]]|?Has name|limit=${limit}|offset=${offset}`;
      const url = `${WIKI}?action=ask&query=${encodeURIComponent(query)}&format=json&origin=*`;
      const r = await fetch(url);
      const d = await r.json();
      const results = d?.query?.results;
      if (!results) break;

      const keys = Object.keys(results);
      if (keys.length === 0) break;

      for (const key of keys) {
        const page = results[key];
        const name = page?.printouts?.['Has name']?.[0] || page.fulltext;
        if (name && !name.includes('/')) {  // skip subpages
          monsters.push({ name, fulltext: page.fulltext });
        }
      }

      dbg(`Loaded ${monsters.length} monsters so far (offset ${offset})`);
      document.getElementById('list-status').textContent =
        `⏳ Loading... ${monsters.length} monsters found`;

      if (keys.length < limit) break;
      offset += limit;
    }

    // Deduplicate and sort
    const seen = new Set();
    allMonsters = monsters
      .filter(m => { if (seen.has(m.name)) return false; seen.add(m.name); return true; })
      .sort((a, b) => a.name.localeCompare(b.name));

    document.getElementById('list-status').textContent = '';
    document.getElementById('list-label').textContent = 'All RS3 monsters';
    document.getElementById('list-count').textContent = allMonsters.length + ' total';
    renderNpcList('');

  } catch(e) {
    dbg('Monster list load error: ' + e.message);
    document.getElementById('list-status').textContent =
      '⚠️ Could not load full list — use search box above';
    // Fall back to popular list
    allMonsters = POPULAR_NPCS.map(n => ({ name: n.name, fulltext: n.name, cat: n.cat, icon: n.icon }));
    renderNpcList('');
  }
}

  { name:'Aberrant spectre', icon:'👻', cat:'Slayer' },

// ── Render NPC list ────────────────────────────────────────
function renderNpcList(filter) {
  const list = document.getElementById('npc-list');
  const q = filter.toLowerCase().trim();
  const source = allMonsters.length > 0 ? allMonsters : POPULAR_NPCS;

  const filtered = q
    ? source.filter(n => n.name.toLowerCase().includes(q)).slice(0, 100)
    : source.slice(0, 200);

  if (filtered.length === 0) {
    list.innerHTML = `<div id="npc-empty">No matches for "<strong>${filter}</strong>"<br>
      <small>Press Search to look it up directly on the wiki</small></div>`;
    return;
  }

  // Use a document fragment for performance
  const frag = document.createDocumentFragment();
  for (const npc of filtered) {
    const el = document.createElement('div');
    el.className = 'npc-item';
    el.innerHTML = `
      <span class="npc-icon">${npc.icon || '👾'}</span>
      <span class="npc-name">${npc.name}</span>
      ${npc.cat ? `<span class="npc-cat">${npc.cat}</span>` : ''}`;
    el.addEventListener('click', () => lookup(npc.fulltext || npc.name));
    frag.appendChild(el);
  }

  list.innerHTML = '';
  list.appendChild(frag);

  if (q && allMonsters.length > 0 && filtered.length === 100) {
    const more = document.createElement('div');
    more.id = 'npc-empty';
    more.textContent = `Showing first 100 matches — type more to narrow down`;
    list.appendChild(more);
  }
}

// ── Disambiguation detection ───────────────────────────────
async function checkDisambig(title) {
  const url = `${WIKI}?action=query&titles=${encodeURIComponent(title)}&prop=pageprops&ppprop=disambiguation&format=json&origin=*`;
  const r = await fetch(url);
  const d = await r.json();
  const pages = d?.query?.pages;
  if (!pages) return false;
  const page = Object.values(pages)[0];
  // 'disambiguation' key present (even if empty string) means it's a disambig page
  return page?.pageprops?.hasOwnProperty('disambiguation') ?? false;
}

async function getDisambigLinks(title) {
  // Get all links on the disambiguation page
  const url = `${WIKI}?action=parse&page=${encodeURIComponent(title)}&prop=links&format=json&origin=*`;
  const r = await fetch(url);
  const d = await r.json();
  return (d?.parse?.links || [])
    .filter(l => l.ns === 0)  // main namespace only
    .map(l => l['*'])
    .filter(l => !l.includes('disambiguation') && !l.includes('(disambiguation)'));
}

function showDisambigOptions(title, links, msg) {
  document.getElementById('disambig-msg').textContent =
    msg || `"${title}" refers to multiple pages. Which one are you looking for?`;
  const container = document.getElementById('disambig-options');
  container.innerHTML = '';
  for (const link of links) {
    const el = document.createElement('div');
    el.className = 'disambig-option';
    el.textContent = link;
    el.addEventListener('click', () => lookupPage(link));
    container.appendChild(el);
  }
  showDisambig();
  document.getElementById('subtitle').textContent = 'Choose a page';
  setStatus('', '');
}

// ── Suggest alternatives when a page has no drop table ─────
// Used as a fallback for disambig-style pages that MediaWiki doesn't tag with
// __DISAMBIG__ (e.g. "Guard", "Knight"). Calls opensearch for prefix matches
// and shows the results in the existing disambig picker.
async function suggestAlternatives(title) {
  try {
    const url = `${WIKI}?action=opensearch&search=${encodeURIComponent(title)}&limit=20&namespace=0&format=json&origin=*`;
    const r = await fetch(url);
    const d = await r.json();
    const suggestions = (d[1] || []).filter(s => s !== title);
    if (!suggestions.length) {
      setStatus('err', `⚠️ No drop table found for "${title}".`);
      return;
    }
    setStatus('busy', `No drops on "${title}" — pick a related page:`);
    showDisambigOptions(title, suggestions,
      `"${title}" has no drop table. Did you mean one of these?`);
  } catch(e) {
    dbg('suggestAlternatives error: ' + e.message);
    setStatus('err', `⚠️ No drop table found for "${title}".`);
  }
}

// ── Icon URL fixer ─────────────────────────────────────────
function fixIconUrl(src) {
  if (!src) return '';
  let url = src;
  if (url.startsWith('/')) url = 'https://runescape.wiki' + url;
  url = url.replace(/\/thumb\//, '/').replace(/\/\d+px-[^/]+$/, '');
  return url;
}

// ── Rarity classifier ──────────────────────────────────────
function rarityClass(r) {
  if (!r) return { label: '?', cls: 'b-unknown' };
  const s = r.toLowerCase().trim();
  if (s === 'always') return { label: 'Always', cls: 'b-always' };
  const m = s.match(/(\d[\d,.]*)\/(\d[\d,.]*)/);
  if (m) {
    const chance = parseFloat(m[1].replace(/,/g,'')) / parseFloat(m[2].replace(/,/g,''));
    const label = r.split(/[;(]/)[0].trim();
    if (chance >= 0.25)   return { label, cls: 'b-common' };
    if (chance >= 0.03)   return { label, cls: 'b-uncommon' };
    if (chance >= 0.003)  return { label, cls: 'b-rare' };
    if (chance >= 0.0003) return { label, cls: 'b-vr' };
    return                       { label, cls: 'b-ultra' };
  }
  if (s.includes('very rare')||s.includes('ultra')) return { label:r, cls:'b-vr' };
  if (s.includes('rare'))     return { label:r, cls:'b-rare' };
  if (s.includes('uncommon')) return { label:r, cls:'b-uncommon' };
  if (s.includes('common'))   return { label:r, cls:'b-common' };
  return { label:r, cls:'b-unknown' };
}

// ── Strip "(Level: N)" suffix from OCR output ─────────────
// Tesseract garbles the "(" and the first letter or two of "level" in many ways:
//   "Wolf level 11J", "Cow leyel220", "Chicken OJevel- 1J", "Bull Ulevel- 5",
//   "Thrower troll lexeals 67  l", "Monkey Olovel- 3", "Scorpion Uevel- 14  l".
// Trying to enumerate every spelling with regex is a losing game, so we instead
// anchor at the first digit run (the level number) and walk back through:
//   1. separators (whitespace, -, :, ., comma, semicolon, opening parens)
//   2. a single "level-like" word (3-8 letters, contains 'e', ends in l/s — covers
//      "level", "leyel", "evel", "Ulevel", "OJevel", "Olovel", "Uevel", "lexel",
//      "lexeals", "levels", "Jevel", etc.)
//   3. more separators
// then cut everything from that point on. Falls through to trim-only when the OCR
// returns no digits (a bare name with no level info).
function stripLevelSuffix(raw) {
  if (!raw) return raw;
  raw = raw.trim();
  var parenIdx = raw.search(/[([{<]/);
  if (parenIdx > 0) raw = raw.slice(0, parenIdx).trim();

  var dm = raw.match(/\d+/);
  if (dm) {
    var i = dm.index - 1;
    while (i >= 0 && /[\s\-:.,;(]/.test(raw[i])) i--;
    var wordEnd = i + 1;
    while (i >= 0 && /[a-zA-Z]/.test(raw[i])) i--;
    var wordStart = i + 1;
    var word = raw.slice(wordStart, wordEnd);
    if (word.length >= 3 && word.length <= 8 && /e/i.test(word) && /[ls]$/i.test(word)) {
      var cutAt = wordStart - 1;
      while (cutAt >= 0 && /[\s\-:.,;(]/.test(raw[cutAt])) cutAt--;
      raw = raw.slice(0, cutAt + 1);
    }
  }
  // Trailing junk: stray single letter (misread ')'), residual digits, punctuation
  raw = raw.replace(/(?<=[a-zA-Z\d])\s+[lLjJiI1]\s*$/, '').trim();
  raw = raw.replace(/[\s\-]+\d+\s*$/, '').trim();
  raw = raw.replace(/[\s\-|_.,;:!?]+$/, '').trim();
  return raw;
}

// ── Resolve OCR output against the local monster list ─────
// OCR can corrupt trailing characters (e.g. "Chicken (Level: 2)" → "Chicken OG",
// "Bull (Level: 11)" → "Bull Ul"). After the regex strip pass, try matching the
// result against allMonsters; if no exact hit, drop trailing words one at a time
// until a known monster name matches. Falls back to raw text when nothing matches
// so the wiki OpenSearch path can still attempt fuzzy fallback.
function resolveOcrName(raw) {
  if (!raw) return raw;
  raw = raw.trim();

  // Strip any trailing tokens that are purely digits or single letters
  // (level number remnants that survived stripLevelSuffix)
  raw = raw.replace(/(\s+[\d]+)+\s*$/, '').trim();
  raw = raw.replace(/\s+[lLjJiI1]\s*$/, '').trim();

  if (!allMonsters.length) return raw;
  var lower = raw.toLowerCase();
  for (var i = 0; i < allMonsters.length; i++) {
    if (allMonsters[i].name.toLowerCase() === lower) return allMonsters[i].name;
  }
  var parts = raw.split(/\s+/);
  while (parts.length > 1) {
    parts.pop();
    var sub = parts.join(' ').toLowerCase();
    for (var j = 0; j < allMonsters.length; j++) {
      if (allMonsters[j].name.toLowerCase() === sub) {
        dbg('OCR name "' + raw + '" → local match "' + allMonsters[j].name + '"');
        return allMonsters[j].name;
      }
    }
  }
  return raw;
}

// ── Main lookup ────────────────────────────────────────────
async function lookup(name) {
  if (!name) return;
  setStatus('busy', `🔍 Searching for "${name}"...`);
  showDrops();
  document.getElementById('subtitle').textContent = name;
  document.getElementById('search-input').value = name;
  document.getElementById('drops').innerHTML = '';

  // 1. OpenSearch to get best title match
  let title = null;
  try {
    const r = await fetch(`${WIKI}?action=opensearch&search=${encodeURIComponent(name)}&limit=5&format=json&origin=*`);
    const d = await r.json();
    if (d[1]?.length) title = d[1][0];
  } catch(e) {
    setStatus('err', '❌ Network error: ' + e.message);
    return;
  }
  if (!title) { setStatus('err', `⚠️ "${name}" not found on the RS Wiki.`); return; }

  await lookupPage(title);
}

async function lookupPage(title) {
  setStatus('busy', `📄 Loading: ${title}...`);
  document.getElementById('subtitle').textContent = title;

  // Reset NPC image
  const npcImg = document.getElementById('npc-img');
  const logo   = document.getElementById('titlebar-logo');
  npcImg.style.display = 'none';
  logo.style.display   = 'inline';

  // Check disambiguation
  try {
    const isDisambig = await checkDisambig(title);
    if (isDisambig) {
      setStatus('busy', `🔀 "${title}" is a disambiguation page...`);
      const links = await getDisambigLinks(title);
      showDisambigOptions(title, links);
      return;
    }
  } catch(e) { /* continue */ }

  // Fetch NPC image and page HTML in parallel
  const [imgUrl, html] = await Promise.all([
    fetchNpcImage(title),
    fetchPageHtml(title),
  ]);

  // Show NPC image if found
  if (imgUrl) {
    npcImg.src = imgUrl;
    npcImg.style.display = 'block';
    logo.style.display   = 'none';
    npcImg.onerror = () => { npcImg.style.display='none'; logo.style.display='inline'; };
  }

  if (!html) { setStatus('err', '❌ Empty page.'); return; }

  // Extract drops — returns { normal: sections[], hard: sections[] }
  const { normal, hard } = extractDrops(html);
  const totalNormal = normal.reduce((s,sec) => s + sec.rows.length, 0);
  const totalHard   = hard.reduce((s,sec)   => s + sec.rows.length, 0);
  const total = totalNormal + totalHard;

  if (total === 0) {
    // Page exists but has no drop table — often a disambig that MediaWiki didn't
    // tag with __DISAMBIG__ ("Guard", "Knight", etc.) or a parent page whose
    // variants live on separate articles. Offer opensearch suggestions so the
    // user can pick the right one.
    await suggestAlternatives(title);
    return;
  }

  setStatus('ok', `✅ ${total} drops for ${title}` + (hard.length ? ' (Normal + Hard mode)' : ''));
  showDrops();
  renderAllSections(normal, hard);
}

async function fetchNpcImage(title) {
  try {
    const url = `${WIKI}?action=query&prop=pageimages&titles=${encodeURIComponent(title)}&pithumbsize=80&piprop=thumbnail&format=json&origin=*`;
    const r = await fetch(url);
    const d = await r.json();
    const pages = d?.query?.pages;
    if (!pages) return null;
    const page = Object.values(pages)[0];
    return page?.thumbnail?.source || null;
  } catch(e) { return null; }
}

async function fetchPageHtml(title) {
  try {
    const r = await fetch(`${WIKI}?action=parse&page=${encodeURIComponent(title)}&prop=text&format=json&origin=*`);
    const d = await r.json();
    return d?.parse?.text?.['*'] || '';
  } catch(e) { return ''; }
}

// ── Drop table parser ──────────────────────────────────────
// Strip footnote markers like [1], [d1], [s2] etc
function stripNotes(text) {
  return text.replace(/\[\s*[a-z]?\s*\d+\s*\]/gi, '').trim();
}

function extractDrops(rawHtml) {
  const div = document.createElement('div');
  div.innerHTML = rawHtml;

  // Find ALL drop headings - check both span IDs and heading text
  // MediaWiki encodes parentheses in IDs as .28 and .29, so
  // "Drops (hard mode)" becomes id="Drops_.28hard_mode.29"
  const dropHeadings = [];
  const seenEls = new Set();

  // Method 1: span IDs containing "drop" (case insensitive)
  for (const span of div.querySelectorAll('span[id]')) {
    if (span.id.toLowerCase().includes('drop')) {
      const el = span.closest('h2,h3,h4');
      if (el && !seenEls.has(el)) {
        seenEls.add(el);
        dropHeadings.push({ el, text: el.textContent.trim() });
      }
    }
  }

  // Method 2: heading text contains "drop" — catches any missed by ID search
  for (const h of div.querySelectorAll('h2,h3,h4')) {
    if (h.textContent.toLowerCase().includes('drop') && !seenEls.has(h)) {
      seenEls.add(h);
      dropHeadings.push({ el: h, text: h.textContent.trim() });
    }
  }

  // Log all span IDs found for diagnosis
  const allSpanIds = Array.from(div.querySelectorAll('span[id]')).map(s=>s.id);
  dbg('Span IDs with "drop": ' + allSpanIds.filter(id=>id.toLowerCase().includes('drop')).join(', '));

  dbg('Drop headings: ' + dropHeadings.map(h=>h.text).join(' | '));
  if (dropHeadings.length === 0) return { normal: [], hard: [] };

  const normal = [], hard = [];
  for (const heading of dropHeadings) {
    const isHard = heading.text.toLowerCase().includes('hard');
    const sections = parseSectionsFromHeading(div, heading.el);
    dbg((isHard?'Hard':'Normal') + ': ' + sections.length + ' sections');
    if (isHard) hard.push(...sections);
    else        normal.push(...sections);
  }
  return { normal, hard };
}

function parseSectionsFromHeading(div, startEl) {
  const startLevel = parseInt(startEl.tagName[1]);
  const allEls = Array.from(div.querySelectorAll('h2,h3,h4,table'));

  // Use contains() instead of indexOf() — closest() can return the same node
  // but reference equality may fail across different query results
  let startIdx = allEls.indexOf(startEl);
  if (startIdx === -1) {
    // Fallback: find by DOM position using contains
    startIdx = allEls.findIndex(el =>
      el === startEl || el.contains(startEl) || startEl.contains(el)
    );
  }

  dbg('  parseSections: startEl=' + startEl.textContent.trim().slice(0,30) +
      ' level=h' + startLevel + ' idx=' + startIdx + ' of ' + allEls.length);

  if (startIdx === -1) return [];

  const sections = [];
  let sectionName = 'Drops';

  for (let i = startIdx + 1; i < allEls.length; i++) {
    const el  = allEls[i];
    const tag = el.tagName.toLowerCase();
    const level = parseInt(tag[1]);

    if ((tag==='h2'||tag==='h3'||tag==='h4') && level <= startLevel) {
      dbg('  stopping at: ' + el.textContent.trim().slice(0,30));
      break;
    }
    if (tag==='h3'||tag==='h4') {
      sectionName = stripNotes(el.textContent);
      dbg('  section: "' + sectionName + '"');
    }
    if (tag==='table') {
      const rows = parseTable(el);
      if (rows.length > 0) {
        const existing = sections.find(s => s.name === sectionName);
        if (existing) existing.rows.push(...rows);
        else sections.push({ name: sectionName, rows });
      }
    }
  }
  return sections;
}

function parseTable(table) {
  const rows = [];
  for (const tr of table.querySelectorAll('tr')) {
    const tds = Array.from(tr.querySelectorAll('td'));
    if (tds.length < 2) continue;
    let name='', qty='', rarity='', img='';
    for (const td of tds) {
      const text = stripNotes(td.textContent.trim());
      if (!img) {
        const i = td.querySelector('img');
        if (i) img = fixIconUrl(i.getAttribute('src') || i.src || '');
      }
      if (!name && td.querySelector('a')) {
        const a = td.querySelector('a');
        const c = stripNotes(a.textContent.trim());
        if (c.length > 1 && c.length < 80 && !c.match(/^\d+$/)) name = c;
      }
      if (!qty && /^\d[\d,–\-\s]*$/.test(text) && text.length < 20) qty = text;
      if (!rarity && /^(always|\d[\d,]*\s*\/\s*[\d,]+)/i.test(text)) {
        rarity = stripNotes(text.split(';')[0].trim());
      }
    }
    if (!name || name.length > 80) continue;
    if (name.toLowerCase()==='item'||name.toLowerCase()==='items') continue;
    rows.push({ name, qty, rarity, img });
  }
  // Deduplicate rows with the same name (caused by multi-note table rows)
  const seen = new Set();
  return rows.filter(r => {
    if (seen.has(r.name)) return false;
    seen.add(r.name);
    return true;
  });
}

// ── Render drops ───────────────────────────────────────────
function renderModeBlock(container, modeLabel, modeColor, sections) {
  if (sections.length === 0) return;

  // Mode header (e.g. "Normal Mode" / "Hard Mode")
  const modeHdr = document.createElement('div');
  modeHdr.style.cssText = `background:${modeColor};padding:5px 12px;font-size:11px;` +
    `font-weight:700;letter-spacing:1px;color:#fff;border-bottom:2px solid rgba(0,0,0,0.3);` +
    `text-transform:uppercase;position:sticky;top:0;z-index:2;`;
  modeHdr.textContent = modeLabel;
  container.appendChild(modeHdr);

  for (const sec of sections) {
    if (sec.rows.length === 0) continue;
    container.appendChild(makeSectionBlock(sec));
  }
}

function renderAllSections(normal, hard) {
  const container = document.getElementById('drops');
  container.innerHTML = '';

  if (hard.length > 0) {
    // Has both modes — show mode headers
    renderModeBlock(container, '⚔ Normal Mode', '#1a5c2a', normal);
    renderModeBlock(container, '💀 Hard Mode',  '#5c1a1a', hard);
  } else {
    // Single mode — just render sections directly
    for (const sec of normal) {
      if (sec.rows.length === 0) continue;
      container.appendChild(makeSectionBlock(sec));
    }
  }
}

function makeSectionBlock(sec) {
  const wrapper = document.createElement('div');
  wrapper.className = 'section-wrapper';

  const hdr = document.createElement('div');
  hdr.className = 'section-hdr';
  hdr.innerHTML = `
    <span class="hdr-left">
      <span class="chevron">▼</span>
      <span>${sec.name}</span>
    </span>
    <span class="row-count">${sec.rows.length} items</span>`;

  const body = document.createElement('div');
  body.className = 'section-body';
  for (const row of sec.rows) body.appendChild(makeDropRow(row));

  requestAnimationFrame(() => { body.style.maxHeight = body.scrollHeight + 'px'; });

  hdr.addEventListener('click', () => {
    const collapsed = hdr.classList.toggle('collapsed');
    if (collapsed) {
      body.style.maxHeight = body.scrollHeight + 'px';
      requestAnimationFrame(() => body.classList.add('collapsed'));
    } else {
      body.classList.remove('collapsed');
      body.style.maxHeight = body.scrollHeight + 'px';
      body.addEventListener('transitionend', () => {
        if (!hdr.classList.contains('collapsed')) body.style.maxHeight = 'none';
      }, { once: true });
    }
  });

  wrapper.appendChild(hdr);
  wrapper.appendChild(body);
  return wrapper;
}

function makeDropRow(row) {
  const el = document.createElement('div');
  el.className = 'drop-row';
  if (row.img) {
    const img = document.createElement('img');
    img.className = 'item-img'; img.src = row.img; img.alt = row.name;
    img.onerror = function() { this.replaceWith(placeholder(row.name)); };
    el.appendChild(img);
  } else { el.appendChild(placeholder(row.name)); }
  const info = document.createElement('div'); info.className = 'item-info';
  const nm = document.createElement('div'); nm.className = 'item-name'; nm.textContent = row.name;
  info.appendChild(nm);
  if (row.qty) {
    const q = document.createElement('div'); q.className = 'item-qty'; q.textContent = 'x' + row.qty;
    info.appendChild(q);
  }
  el.appendChild(info);
  if (row.rarity) {
    const { label, cls } = rarityClass(row.rarity);
    const wrap = document.createElement('div'); wrap.className = 'rarity';
    const badge = document.createElement('span'); badge.className = 'badge ' + cls; badge.textContent = label;
    wrap.appendChild(badge); el.appendChild(wrap);
  }
  return el;
}

function placeholder(name) {
  const d = document.createElement('div'); d.className = 'item-placeholder';
  d.textContent = (name||'?').charAt(0).toUpperCase(); return d;
}

// ── Message handler (from Lua) ─────────────────────────────
function handleMsg(text) {
  if (text.startsWith('LOOKUP:')) lookup(text.slice(7));
  else if (text === 'FOCUS_SEARCH') {
    searchInput.value = ''; searchInput.focus();
    if (inDropsView) { showBrowser(); renderNpcList(''); }
  }
}
window.addEventListener('message', evt => {
  if (!evt.data) return;
  if (evt.data.type === 'pluginMessage' && evt.data.content) {
    handleMsg(new TextDecoder().decode(new Uint8Array(evt.data.content)).trim());
  } else if (typeof evt.data === 'string') {
    handleMsg(evt.data.trim());
  }
});

// ── Alt1 Integration ───────────────────────────────────────
// flashBadge is module-scope so readExamineWindow() can always call it
let _alt1Badge = null;
function flashBadge(color) {
  if (!_alt1Badge) return;
  _alt1Badge.style.background = color || '#4caf50';
  setTimeout(function() { _alt1Badge.style.background = '#e94560'; }, 1500);
}

let alt1InitDone = false;
function tryInitAlt1() {
  if (alt1InitDone) return;
  if (typeof window.alt1 === 'undefined') return;
  alt1InitDone = true;

  const badge = document.createElement('div');
  badge.id = 'alt1badge';
  badge.style.cssText = 'position:fixed;top:4px;right:30px;background:#e94560;color:#fff;' +
    'font-size:9px;padding:1px 5px;border-radius:2px;font-weight:700;z-index:100;cursor:pointer;';
  badge.textContent = 'ALT1';
  badge.title = 'Click to manually read screen';
  document.body.appendChild(badge);
  _alt1Badge = badge;  // make flashBadge usable from anywhere

  dbg('alt1 v' + window.alt1.version + ' pixel=' + window.alt1.permissionPixel);
  dbg('permInstalled=' + window.alt1.permissionInstalled);
  dbg('permGameState=' + window.alt1.permissionGameState);
  dbg('permOverlay=' + window.alt1.permissionOverlay);
  dbg('rsLinked=' + window.alt1.rsLinked);

  try { window.alt1.identifyAppUrl('./appconfig.json'); dbg('identifyApp called'); }
  catch(e) { dbg('identifyApp err: ' + e.message); }

  var a1lib = null;
  var a1script = document.createElement('script');
  a1script.src = './alt1base.bundle.js';
  a1script.onload = function() {
    var attempts = 0;
    function tryA1lib() {
      a1lib = window.A1lib;
      if (a1lib && typeof a1lib.captureHoldFullRs === 'function') {
        dbg('A1lib loaded: yes');
        dbg('A1lib keys: ' + Object.keys(a1lib).filter(k => !k.startsWith('_')).join(', '));
        initAlt1(a1lib);
      } else if (attempts < 30) {
        attempts++;
        setTimeout(tryA1lib, 100);
      } else {
        dbg('A1lib: captureHoldFullRs unavailable after 3s');
      }
    }
    tryA1lib();
  };
  a1script.onerror = function() {
    dbg('Failed to load alt1base.bundle.js - place it in same folder as drops.html');
    setStatus('ok', 'Alt1 - right-click NPC, hover Examine, press Alt+1');
  };
  document.head.appendChild(a1script);

  function processOpenInfo(info) {
    if (!info) return false;
    let text = info;
    if (typeof info === 'string') {
      try { const p = JSON.parse(info); text = p.text || p.match || p.string || JSON.stringify(p); }
      catch(e) {}
    }
    dbg('openInfo text: ' + text);
    const parsed = parseExamineText(text);
    if (parsed) {
      const name = resolveOcrName(parsed);
      flashBadge('#4caf50');
      setStatus('busy', 'Detected: ' + name);
      setTimeout(function() { lookup(name); }, 200);
      return true;
    }
    return false;
  }

  const handled = processOpenInfo(window.alt1.openInfo);
  if (!handled) setStatus('ok', 'Alt1 - right-click NPC, hover Examine, press Alt+1');

  let lastOpenInfo = JSON.stringify(window.alt1.openInfo);
  setInterval(function() {
    const cur = JSON.stringify(window.alt1.openInfo);
    if (cur !== lastOpenInfo) {
      lastOpenInfo = cur;
      dbg('openInfo changed: ' + cur);
      processOpenInfo(window.alt1.openInfo);
    }
  }, 200);

  badge.addEventListener('click', function() {
    flashBadge('#f5c518');
    if (a1lib) readExamineWindow();
    else dbg('A1lib not loaded yet');
  });
}

// Try immediately, then every 500ms for 30s
tryInitAlt1();
(function() {
  var elapsed = 0;
  var poll = setInterval(function() {
    elapsed += 500;
    if (alt1InitDone || elapsed >= 30000) { clearInterval(poll); return; }
    tryInitAlt1();
  }, 500);
})();

// ── Image-anchor templates (loaded once) ───────────────────
var anchorTL      = null;   // TopLeft.png     — top-left corner of examine window
var anchorBR      = null;   // BottomRight.png — bottom-right corner of examine window
var anchorExamine = null;   // Examine.png     — the "Examine" label in the menu row
var anchorsLoading = false;

async function loadAnchors() {
  if (anchorTL && anchorBR && anchorExamine) return true;
  if (anchorsLoading) return false;
  anchorsLoading = true;
  try {
    var ID = window.A1lib.ImageDetect;
    anchorTL      = await ID.imageDataFromUrl('./TopLeft.png');
    anchorBR      = await ID.imageDataFromUrl('./BottomRight.png');
    anchorExamine = await ID.imageDataFromUrl('./Examine.png');
    dbg('Anchors loaded — TL:' + anchorTL.width + 'x' + anchorTL.height +
        ' BR:' + anchorBR.width + 'x' + anchorBR.height +
        ' Ex:' + anchorExamine.width + 'x' + anchorExamine.height);
    return true;
  } catch(e) {
    dbg('Anchor load error: ' + e.message);
    anchorsLoading = false;
    return false;
  }
}

// ── Tesseract loader (loaded once on demand) ────────────────
var tesseractWorker = null;
var tesseractLoading = false;

async function getTesseract() {
  if (tesseractWorker) return tesseractWorker;
  if (tesseractLoading) {
    // wait up to 10s for it to finish loading
    for (var i = 0; i < 100; i++) {
      await new Promise(function(r){ setTimeout(r, 100); });
      if (tesseractWorker) return tesseractWorker;
    }
    return null;
  }
  tesseractLoading = true;
  return new Promise(function(resolve) {
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload = async function() {
      try {
        dbg('Tesseract.js loaded — initialising worker...');
        var worker = await Tesseract.createWorker('eng', 1, {
          logger: function(m) { if (m.status === 'recognizing text') dbg('OCR progress: ' + Math.round(m.progress * 100) + '%'); }
        });
        // Tune for single-line RS3 menu text
        await worker.setParameters({
          tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 '-,!.",
          tessedit_pageseg_mode: '7',   // treat image as single text line
          preserve_interword_spaces: '1',
        });
        tesseractWorker = worker;
        dbg('Tesseract worker ready');
        resolve(worker);
      } catch(e) {
        dbg('Tesseract init error: ' + e.message);
        tesseractLoading = false;
        resolve(null);
      }
    };
    s.onerror = function() {
      dbg('Failed to load Tesseract.js from CDN');
      tesseractLoading = false;
      resolve(null);
    };
    document.head.appendChild(s);
  });
}

function initAlt1(a1lib) {
  // Pre-load anchors and warm up Tesseract as soon as A1lib is ready
  loadAnchors();
  getTesseract();

  a1lib.on('alt1pressed', function(e) {
    dbg('alt1pressed x=' + e.x + ' y=' + e.y);
    readExamineWindow();
  });
  dbg('Alt+1 hook registered');
}

// ── Helpers ─────────────────────────────────────────────────

// Convert an ImageData-like {data, width, height} to a data-URL via canvas
function imgDataToCanvas(imgData) {
  var c = document.createElement('canvas');
  c.width  = imgData.width;
  c.height = imgData.height;
  var ctx = c.getContext('2d');
  var id  = ctx.createImageData(imgData.width, imgData.height);
  id.data.set(imgData.data);
  ctx.putImageData(id, 0, 0);
  return c;
}

// Scale a canvas up by an integer factor (makes Tesseract work better on tiny strips)
function scaleCanvas(src, scale) {
  var dst = document.createElement('canvas');
  dst.width  = src.width  * scale;
  dst.height = src.height * scale;
  var ctx = dst.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(src, 0, 0, dst.width, dst.height);
  return dst;
}

// ── Core: find examine window → OCR monster name ────────────
async function readExamineWindow() {
  if (!window.alt1 || !window.alt1.permissionPixel) {
    setStatus('err', 'Pixel permission not granted — check appconfig.json');
    return;
  }

  setStatus('busy', '🔍 Scanning for Examine window...');

  // Ensure anchors are loaded
  var anchorsOk = await loadAnchors();
  if (!anchorsOk) {
    setStatus('err', 'Anchor images missing — place TopLeft.png, BottomRight.png, Examine.png in the app folder');
    return;
  }

  try {
    var a1lib = window.A1lib;

    // ── 1. Capture the full RS client screen ──────────────────
    var screen = a1lib.captureHoldFullRs();
    if (!screen) {
      setStatus('err', 'Screen capture failed — is RS running?');
      return;
    }
    dbg('Screen: ' + screen.width + 'x' + screen.height);

    // ── 2. Locate the examine window corners + Examine label ────────────────
    // Find all candidate anchors, then pair them up. Pairing rules:
    //   * BR must be below and right of TL (BR.x >= TL.x, BR.y >= TL.y + anchorTL.height).
    //   * Window dims must be sensible (≥ anchor sizes, ≤ ~800x500).
    //   * An Examine anchor must fall inside the window — this rejects spurious
    //     TL/BR matches from other UI corners.
    // Among valid triples, pick the one with the smallest window area (the actual
    // examine menu is typically the smallest such enclosure on screen).
    var tlHits = screen.findSubimage(anchorTL);
    var brHits = screen.findSubimage(anchorBR);
    var exHits = screen.findSubimage(anchorExamine);
    dbg('Anchor hits — TL:' + tlHits.length + ' BR:' + brHits.length + ' Examine:' + exHits.length);

    if (!tlHits.length || !brHits.length) {
      setStatus('err', 'Examine window not found — right-click an NPC, hover Examine, then press Alt+1');
      return;
    }

    var MAX_W = 800, MAX_H = 500;
    var bestTriple = null;
    for (var ti = 0; ti < tlHits.length; ti++) {
      var t = tlHits[ti];
      for (var bi = 0; bi < brHits.length; bi++) {
        var b = brHits[bi];
        // BR must be below+right of TL with non-trivial window dimensions
        if (b.x < t.x) continue;
        if (b.y < t.y + anchorTL.height) continue;
        var w = (b.x + anchorBR.width) - t.x;
        var h = (b.y + anchorBR.height) - t.y;
        if (w > MAX_W || h > MAX_H) continue;
        // Find an Examine label inside this window (interior rows only)
        var interiorY = t.y + anchorTL.height;
        var interiorBottom = b.y;
        var ex = null;
        for (var ei = 0; ei < exHits.length; ei++) {
          var e = exHits[ei];
          if (e.x >= t.x && e.x + anchorExamine.width <= b.x + anchorBR.width &&
              e.y >= interiorY && e.y + anchorExamine.height <= interiorBottom) {
            ex = e; break;
          }
        }
        // Prefer triples with an Examine label; fall back to bare TL/BR if needed
        var area = w * h;
        var score = (ex ? 0 : 1e9) + area;  // pairs without Examine penalised
        if (!bestTriple || score < bestTriple.score) {
          bestTriple = { tl: t, br: b, ex: ex, score: score, w: w, h: h };
        }
      }
    }

    if (!bestTriple) {
      setStatus('err', 'Examine window not found — right-click an NPC, hover Examine, then press Alt+1');
      return;
    }
    var tl = bestTriple.tl, br = bestTriple.br, ex = bestTriple.ex;

    // Window interior rect
    var winX = tl.x;
    var winY = tl.y + anchorTL.height;
    var winW = (br.x + anchorBR.width) - winX;
    var winH = br.y - winY;
    dbg('Window: tl=(' + tl.x + ',' + tl.y + ') br=(' + br.x + ',' + br.y + ')' +
        ' interior w=' + winW + ' h=' + winH + ' ex=' + (ex ? '(' + ex.x + ',' + ex.y + ')' : 'none'));

    // ── 3. Define the name-strip crop based on Examine label position ────────
    var nameAbsX, nameAbsY, nameW, nameH;
    // Pad 3px above and below so descenders (g,y,Q) and ascenders (') are captured
    var PAD = 3;

    if (ex) {
      nameAbsX = ex.x + anchorExamine.width + 3;       // 3px past drop shadow
      nameAbsY = ex.y - PAD;
      nameH    = anchorExamine.height + PAD * 2;
      nameW    = (br.x + anchorBR.width) - nameAbsX;   // up to right wall of window
    } else {
      dbg('No Examine label in window — falling back to full window OCR');
      nameAbsX = winX; nameAbsY = winY - PAD; nameW = winW; nameH = winH + PAD * 2;
    }

    // Clamp to screen bounds — negative Y causes bindGetRegion crash
    if (nameAbsY < 0) { nameH += nameAbsY; nameAbsY = 0; }
    if (nameAbsX < 0) { nameW += nameAbsX; nameAbsX = 0; }
    if (nameAbsX + nameW > screen.width)  nameW = screen.width  - nameAbsX;
    if (nameAbsY + nameH > screen.height) nameH = screen.height - nameAbsY;
    if (nameW <= 0) {
      setStatus('err', 'Name crop region zero-width — check Examine.png / BottomRight.png anchors');
      return;
    }

    // ── 4. Grab the name-strip pixels ────────────────────────────────────────
    var stripRaw = screen.toData(nameAbsX, nameAbsY, nameW, nameH);
    var SW = stripRaw.width  || nameW;
    var SH = stripRaw.height || nameH;
    var SD = stripRaw.data;

    // ── 4a. Find word blocks to locate the "(level: N)" suffix ───────────────
    // Strategy: scan the full strip and record all "word blocks" — contiguous
    // runs of columns that have at least one bright pixel. Then find all gap
    // positions (transitions from bright→dark). The "(level: N)" block always
    // sits at the far right of the strip. The gap BEFORE the last word block
    // is our clip point IF the last word block looks like a level suffix
    // (i.e. it starts with something other than a capital letter — but we
    // can't tell from pixels alone, so instead: clip at the LAST gap that is
    // followed by another gap somewhere to its right, meaning there is at
    // least one more word after the gap. If the name has no level suffix,
    // clipCol stays at SW).
    //
    // Simpler & robust: build a column brightness map, then find all gap runs.
    // The last gap run that has bright pixels on BOTH sides is the space before
    // "(level:". If the strip ends in bright pixels (no trailing gap) and there
    // is exactly one gap, that gap separates name from level. If there are
    // multiple gaps (multi-word name + level), clip at the LAST gap.

    var BRIGHT_THRESH = 55;

    // Build per-column bright flag
    var colBright = new Uint8Array(SW);
    for (var cx = 0; cx < SW; cx++) {
      for (var cy = 0; cy < SH; cy++) {
        var si = (cy * SW + cx) * 4;
        if ((SD[si] + SD[si+1] + SD[si+2]) / 3 > BRIGHT_THRESH) {
          colBright[cx] = 1;
          break;
        }
      }
    }

    // Find all gap runs: [{start, end}] — runs of dark columns
    var gaps = [];
    var inGap = false, gapStart = 0;
    for (var gx = 0; gx < SW; gx++) {
      if (!colBright[gx] && !inGap) { inGap = true; gapStart = gx; }
      else if (colBright[gx] && inGap) { gaps.push({ start: gapStart, end: gx - 1 }); inGap = false; }
    }
    if (inGap) gaps.push({ start: gapStart, end: SW - 1 });

    dbg('Word gaps: ' + gaps.map(function(g){ return g.start+'-'+g.end+'('+( g.end-g.start+1)+'px)'; }).join(' '));

    // The clip point is the start of the LAST gap that:
    //   1. Has at least 1 bright column to its left (i.e. name exists)
    //   2. Has at least 1 bright column to its right (i.e. something follows)
    //   3. Is at least 2px wide (rules out intra-letter dark columns)
    var clipCol = SW;
    for (var gi = gaps.length - 1; gi >= 0; gi--) {
      var g = gaps[gi];
      var gapWidth = g.end - g.start + 1;
      if (gapWidth < 2) continue;
      // Check bright pixels exist to the left
      var hasLeft = false;
      for (var lx = g.start - 1; lx >= 0; lx--) { if (colBright[lx]) { hasLeft = true; break; } }
      // Check bright pixels exist to the right
      var hasRight = false;
      for (var rx = g.end + 1; rx < SW; rx++) { if (colBright[rx]) { hasRight = true; break; } }
      if (hasLeft && hasRight) {
        clipCol = g.start;  // clip at the start of this gap
        dbg('Clip at last qualifying gap: col ' + clipCol + ' (gap ' + g.start + '-' + g.end + ')');
        break;
      }
    }

    dbg('Final clipCol=' + clipCol + ' / SW=' + SW);

    // Build the (possibly clipped) strip ImageData
    var clippedW    = Math.max(1, clipCol);
    var clippedData = { width: clippedW, height: SH,
                        data: new Uint8ClampedArray(clippedW * SH * 4) };
    for (var row = 0; row < SH; row++) {
      for (var col = 0; col < clippedW; col++) {
        var src = (row * SW + col) * 4;
        var dst = (row * clippedW + col) * 4;
        clippedData.data[dst]   = SD[src];
        clippedData.data[dst+1] = SD[src+1];
        clippedData.data[dst+2] = SD[src+2];
        clippedData.data[dst+3] = 255;
      }
    }

    var stripCanvas = imgDataToCanvas(clippedData);

    // Scale up 4× — Tesseract needs enough pixels for small RS menu text
    var SCALE = 4;
    var scaledCanvas = scaleCanvas(stripCanvas, SCALE);

    // Check average brightness of the strip
    var avgCtx   = scaledCanvas.getContext('2d');
    var samplePx = avgCtx.getImageData(0, 0, scaledCanvas.width, scaledCanvas.height);
    var avgBright = 0;
    for (var pi = 0; pi < samplePx.data.length; pi += 4)
      avgBright += (samplePx.data[pi] + samplePx.data[pi+1] + samplePx.data[pi+2]) / 3;
    avgBright /= (samplePx.data.length / 4);
    dbg('Strip avg brightness: ' + avgBright.toFixed(1));

    // Invert dark backgrounds using pixel manipulation (CSS filter is unreliable)
    if (avgBright < 128) {
      var inv = avgCtx.createImageData(scaledCanvas.width, scaledCanvas.height);
      for (var ii = 0; ii < samplePx.data.length; ii += 4) {
        inv.data[ii]   = 255 - samplePx.data[ii];
        inv.data[ii+1] = 255 - samplePx.data[ii+1];
        inv.data[ii+2] = 255 - samplePx.data[ii+2];
        inv.data[ii+3] = 255;
      }
      avgCtx.putImageData(inv, 0, 0);
      dbg('Inverted strip for Tesseract');
    }

    // Always draw to the OCR canvas (it shows if setting is on)
    (function() {
      var el = getOrCreateOcrCanvas();
      el.width  = scaledCanvas.width;
      el.height = scaledCanvas.height;
      el.getContext('2d').drawImage(scaledCanvas, 0, 0);
      el.title  = 'OCR strip — clipCol=' + clipCol + ' scale=' + SCALE + 'x';
      el.style.bottom = settings.debugLog ? (DEBUG_OVERLAY_HEIGHT + 'px') : '0px';
      if (settings.ocrCanvas) el.style.display = 'block';
    })();

    // ── 5. Run Tesseract OCR on the clipped strip ─────────────────────────────
    setStatus('busy', '🔡 Running OCR...');
    var worker = await getTesseract();
    if (!worker) {
      setStatus('err', 'Tesseract not available — check network/CDN');
      return;
    }

    var result = await worker.recognize(scaledCanvas);
    var raw = (result.data.text || '').trim();
    dbg('Tesseract raw: "' + raw + '"');

    raw = stripLevelSuffix(raw);

    if (!raw || raw.length < 2) {
      setStatus('err', 'OCR returned no text — try hovering Examine and pressing Alt+1 again');
      return;
    }

    var resolved = resolveOcrName(raw);
    dbg('OCR result: "' + raw + '" → "' + resolved + '"');
    flashBadge('#4caf50');
    setStatus('busy', '✨ Detected: ' + resolved);
    lookup(resolved);

  } catch(e) {
    dbg('readExamineWindow error: ' + e.message + '\n' + (e.stack || '').slice(0, 200));
    setStatus('err', 'Error: ' + e.message.slice(0, 80));
  }
}

function parseExamineText(text) {
  if (!text) return null;
  var m = text.match(/Examine[^a-z]+(.+)/i);
  if (m) return m[1].trim();
  return null;
}

// ── Init ───────────────────────────────────────────────────
applyToggleUI();   // sync saved opacity + toggle state to the DOM
showBrowser();
searchInput.focus();
loadMonsterList();
</script>
